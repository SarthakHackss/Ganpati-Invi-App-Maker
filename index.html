<!doctype html>
<html lang="mr" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Patil Ganpati Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Noto+Serif+Devanagari:wght@100..900&family=Noto+Sans+Devanagari:wght@100..900&family=Sura:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var host = window.location.hostname;
          if (host && host.endsWith('.sarthakpatil.social') && host !== 'ganpatiinvi.sarthakpatil.social') {
            var sub = host.replace('.sarthakpatil.social', '').toLowerCase();
            if (sub && sub !== 'www') {
              var slug = (sub === 'ajit' || sub === 'ajitpatil') ? 'ajitpatil' : sub;
              var search = window.location.search || '';
              var targetUrl = 'https://ganpatiinvi.sarthakpatil.social/?c=' + encodeURIComponent(slug);
              if (search) {
                var cleanSearch = search.replace(/^\?/, '').split('&').filter(function(p) {
                  return !p.startsWith('c=') && !p.startsWith('client=');
                }).join('&');
                if (cleanSearch) {
                  targetUrl += '&' + cleanSearch;
                }
              }
              if (window.location.hash) {
                targetUrl += window.location.hash;
              }
              window.location.replace(targetUrl);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
